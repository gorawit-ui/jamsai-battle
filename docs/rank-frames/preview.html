<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Rally — Rank Frames</title>
<link rel="stylesheet" href="rank-avatar.css"><style>*{box-sizing:border-box}body{margin:0;background:#2f9bea;color:#17181c;font-family:system-ui,sans-serif;padding:24px}main{max-width:1180px;margin:auto}h1{font-size:clamp(26px,5vw,44px);color:#ffdd3c;text-shadow:3px 3px #17181c;margin:0 0 12px}.toolbar,article{background:#fffdf4;border:3px solid #17181c;border-radius:20px;box-shadow:5px 5px #17181c}.toolbar{padding:18px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:25px}input[type=number]{width:90px;padding:8px;border:2px solid;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}article{text-align:center;padding:16px 5px 10px;overflow:hidden}h2{margin:0 0 8px}article .large{display:grid;place-items:center}article footer{display:flex;justify-content:center;align-items:center;gap:14px;border-top:2px dashed #dbd9cf;margin:8px 12px 0;padding:8px 0;font-size:12px}.selected{outline:5px solid #ffdd3c;outline-offset:4px}button{background:#ffdd3c;border:2px solid #17181c;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}p{line-height:1.5}#selected{font-weight:800}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){body{padding:12px}.grid{gap:12px}article .rr-avatar{max-width:100%}}</style>
<main><h1>Reading Rally · Rank Frames</h1><p>ทดลองใส่รูปของคุณ — รูปอยู่ด้านหลัง กรอบโปร่งใสอยู่ด้านหน้า</p><div class="toolbar"><label>เลือกรูป <input id="photo" type="file" accept="image/*"></label><label><input id="motion" type="checkbox" checked> เปิดวิ้บวับ</label><label>คะแนน <input id="score" type="number" min="0" value="0"></label><span id="selected"></span><button id="reset">ล้างรูป</button></div><div id="grid" class="grid"></div><p>ภาพ PNG เป็นภาพนิ่งที่มีประกายอยู่แล้ว เอฟเฟกต์เคลื่อนไหวมาจาก CSS · ปิดอัตโนมัติตามการตั้งค่า Reduced Motion ของอุปกรณ์ · ไม่มีการอัปโหลดรูปที่เลือกไปยังเซิร์ฟเวอร์</p></main><script src="rank-avatar.js"></script><script>
let photoUrl='';const grid=document.querySelector('#grid');
function render(){const current=ReadingRallyFrames.getRank(document.querySelector('#score').value);document.querySelector('#selected').textContent='Rank '+current;grid.replaceChildren();ReadingRallyFrames.ranks.forEach(a=>{const card=document.createElement('article');if(a.rank===current)card.className='selected';const title=document.createElement('h2');title.textContent=a.rank+' · '+a.minScore+'+';card.appendChild(title);const large=document.createElement('div');large.className='large';card.appendChild(large);ReadingRallyFrames.mount(large,{rank:a.rank,photoUrl,initials:'RR',size:210,motion:document.querySelector('#motion').checked});const foot=document.createElement('footer');const small=document.createElement('span');foot.appendChild(small);ReadingRallyFrames.mount(small,{rank:a.rank,photoUrl,initials:'RR',size:64,motion:document.querySelector('#motion').checked});const label=document.createElement('span');label.textContent='Leaderboard 64px';foot.appendChild(label);card.appendChild(foot);grid.appendChild(card)})}
document.querySelector('#photo').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{photoUrl=reader.result;render()};reader.readAsDataURL(file)});document.querySelector('#motion').addEventListener('change',render);document.querySelector('#score').addEventListener('input',render);document.querySelector('#reset').addEventListener('click',()=>{photoUrl='';document.querySelector('#photo').value='';render()});render();
</script></html>
